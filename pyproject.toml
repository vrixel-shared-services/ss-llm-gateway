[project]
name = "llm-gateway"
version = "0.1.0"
description = "Vrixel shared LLM gateway: Anthropic Messages API in front of approved model providers, with data-class policy, redaction, budgets and a usage ledger."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.14.3,<3",
  "pydantic-settings>=2.16,<3",
  "pyyaml>=6.0",
  "prometheus-client>=0.26,<1",
  "confluent-kafka>=2.16,<3",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-httpx>=0.66b2",
]

[project.scripts]
llm-gateway = "llm_gateway.app:main"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17", "mypy>=2.4", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
strict = true
packages = ["llm_gateway"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["evals: agent evaluations (run in the evals job)"]
addopts = "-q --cov=llm_gateway --cov-report=term --cov-report=xml --junitxml=reports/junit.xml"

[tool.coverage.report]
fail_under = 90
